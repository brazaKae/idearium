services:
  postgres:
    image: postgres:16-alpine
    container_name: idearium-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: idearium
      POSTGRES_USER: idearium
      POSTGRES_PASSWORD: idearium_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idearium -d idearium"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: idearium_postgres_data
