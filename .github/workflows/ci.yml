name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  api:
    name: API — lint, build, test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: idearium_test
          POSTGRES_USER: idearium
          POSTGRES_PASSWORD: idearium_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://idearium:idearium_dev@localhost:5432/idearium_test?schema=public
      JWT_ACCESS_SECRET: ci-secret-not-for-production-use
      JWT_ACCESS_EXPIRES: 15m
      JWT_REFRESH_EXPIRES_DAYS: '30'
      LOG_LEVEL: fatal

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate -w apps/api

      - name: Lint
        run: npm run lint:api

      - name: Build
        run: npm run build:api

      - name: Test (unit)
        run: npm run test:api --if-present

      - name: Test (e2e)
        run: npm run test:e2e -w apps/api
